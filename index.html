  <style>
    .gate[hidden], .gate-err[hidden] { display: none; }
    .gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(120% 90% at 80% 30%, #12924d 0%, #0b6738 45%, #064d2c 100%); }
    .gate-card { width: min(380px, 100%); background: #fff; border-radius: 22px; padding: 30px 26px 24px;
      box-shadow: 0 2px 6px rgba(6,45,25,.1), 0 24px 60px rgba(4,30,17,.35); display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .gate-logo { width: 74px; height: 74px; border-radius: 20px; background: #0b6738; display: grid; place-items: center; margin: 0 auto 4px; }
    .gate-logo img { width: 40px; height: auto; }
    .gate h1 { font-size: 24px; font-weight: 800; color: #12261a; }
    .gate p { color: #627266; font-size: 14.5px; line-height: 1.6; }
    .gate [lang="ar"] { font-family: "Cairo", sans-serif; }
    .gate input[type="password"] { height: 50px; text-align: center; font-size: 20px; letter-spacing: .3em; border: 1.5px solid #e3e9df;
      border-radius: 12px; outline: none; width: 100%; }
    .gate input[type="password"]:focus { border-color: #0e7c42; box-shadow: 0 0 0 3px rgba(23,144,80,.18); }
    .gate-rem { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #627266; }
    .gate-rem input { accent-color: #0b6738; width: 16px; height: 16px; }
    .gate button { height: 50px; border: 0; border-radius: 999px; background: #d7262e; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
    .gate button:hover { background: #b51d24; }
    .gate button[disabled] { opacity: .7; cursor: wait; }
    .gate-err { color: #b51d24; font-weight: 700; font-size: 14px; }
    .gate-shake { animation: gshake .35s; }
    @keyframes gshake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  </style>
</head>

    var KEY = "wm_access";
    function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
    function toB64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
    function fromPass(pw) {

        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
    }
    function open(key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data)).then(function (buf) {
        var site = JSON.parse(new TextDecoder().decode(buf));
        var gate = document.getElementById("gate");
        gate.parentNode.removeChild(gate);
        document.body.insertAdjacentHTML("afterbegin", site.html);
        site.scripts.forEach(function (code) { var s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); });
        return key;
      });
    }
    function store(key) {
      return crypto.subtle.exportKey("raw", key).then(function (raw) { try { localStorage.setItem(KEY, toB64(raw)); } catch (e) {} });
    }
    var form = document.getElementById("gateForm"), btn = document.getElementById("gateBtn"), err = document.getElementById("gateErr"), pw = document.getElementById("gatePw");
    if (!window.crypto || !crypto.subtle) { err.textContent = "This page needs a secure (https) connection."; err.hidden = false; btn.disabled = true; return; }

    try { saved = localStorage.getItem(KEY); } catch (e) {}

      if (!pw.value) return;
